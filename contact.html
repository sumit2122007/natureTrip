<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CONTACT PAGE</title>
    <link rel="stylesheet" href="./css/style.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
      integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <nav class="navbar bg-dark">
      <div class="container">
        <h1 class="logo lg-heading text-light">WT</h1>
        <button class="hamburger" aria-label="Toggle navigation" aria-expanded="false">
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
        </button>
        <ul class="nav-items">
          <li class="nav-item"><a href="./index.html">Home</a></li>
          <li class="nav-item"><a href="./about.html">About</a></li>
          <li class="nav-item"><a href="./contact.html">Contact</a></li>
        </ul>
      </div>
    </nav>

    <section class="contact-form">
      <div class="container">
        <div class="form-wrapper">
          <div class="company-address">
            <div class="address-group">
              <i class="fas fa-map-marker-alt fa-3x text-red"></i>
              <h2 class="text-grey md-heading">Location</h2>
              <p>Manpur,Aligarh,Uttar pradesh, 202137</p>
            </div>
            <div class="address-group">
              <i class="far fa-envelope fa-3x text-red"></i>
              <h2 class="text-grey md-heading">Email</h2>
              <p><a href="mailto:sumit2122007@gmail.com" class="contact-email">sumit2122007@gmail.com</a></p>
            </div>
            <div class="address-group">
              <i class="fas fa-phone-square alt fa-3x text-red"></i>
              <h2 class="text-grey md-heading">Call</h2>
              <p>9259324178</p>
            </div>
            <img src="./img/image3.jpeg" alt="" />
          </div>
          <form action="" class="form">
            <h1 class="lg-heading text-black">Contact Us</h1>
            <p class="text-gray">
              Let us know your question,suggested and concerns by filling out
              the contact form below.
            </p>
            <div class="form-group">
              <label for="username">Username</label>
              <input type="text" id="username" required />
            </div>
            <div class="form-group">
              <label for="email">EmailId</label>
              <input type="email" id="email" required />
            </div>
            <div class="form-group">
              <label for="">Phone</label>
              <input type="number" id="phone" required />
            </div>
            <div class="form-group">
              <label for="message">Message</label>
              <textarea name="" id="message"></textarea>
            </div>
            <button type="submit" class="submit">Submit</button>
          </form>
        </div>
      </div>
    </section>

    <footer class="footer">
      <div class="Social-media-links">
        <i class="fab fa-whatsapp fa-4x"></i>
        <i class="fab fa-facebook fa-4x"></i>
        <i class="fab fa-twitter fa-4x"></i>
        <i class="fab fa-instagram fa-4x"></i>
      </div>
      <p>world Travel &copy; 2029,all Rights Reserved</p>
    </footer>
    <script>
      (function(){
        const hamburger = document.querySelector('.hamburger');
        const navItems = document.querySelector('.nav-items');
        if(!hamburger || !navItems) return;
        hamburger.addEventListener('click', function(){
          const isOpen = navItems.classList.toggle('open');
          hamburger.classList.toggle('is-active');
          hamburger.setAttribute('aria-expanded', isOpen);
        });
      })();
    </script>
  </body>
</html>
